# Deployed BY ArgoCD — do not kubectl apply this file by hand after ArgoCD is wired.
# Edit this file in Git; ArgoCD syncs the cluster to match.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-nginx
  labels: { app: gitops-nginx }
spec:
  replicas: 2
  selector: { matchLabels: { app: gitops-nginx } }
  template:
    metadata: { labels: { app: gitops-nginx } }
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-nginx
spec:
  selector: { app: gitops-nginx }
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
